<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" role="img" aria-label="An environment's tab in session-hub: the staging test data document, its Accounts section unfolded with two logins and where their passwords are kept, the URLs, Payments and Notes sections folded">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #cdd6f4; white-space: pre; }
    .dim { fill: #7f849c; }
    .head { fill: #fab387; font-weight: 700; }
    .bold { font-weight: 700; }
    .link { fill: #89b4fa; text-decoration: underline; }
    .user { fill: #94e2d5; }
    .tab { fill: #cdd6f4; font-size: 13px; }
    .tabdim { fill: #7f849c; font-size: 13px; }
  </style>
  <rect width="620" height="400" rx="10" fill="#1e1e2e"/>
  <rect x="0.5" y="0.5" width="619" height="399" rx="10" fill="none" stroke="#45475a"/>
  <rect x="12" y="10" width="196" height="24" rx="4" fill="#313244"/>
  <text x="22" y="27" class="tab">🧪 staging test data</text>
  <text x="222" y="27" class="tabdim">🧪 prod test data</text>
  <text x="370" y="27" class="tabdim">Session hub</text>

  <text x="20" y="64"><tspan class="link">~/src/my-app/docs/test_data_staging.md</tspan></text>
  <text x="20" y="90" class="bold">Test data: staging</text>
  <text x="20" y="110" class="dim">Shared by QA. Reset every night at 02:00.</text>

  <text x="20" y="142" class="head">▾ Accounts</text>
  <text x="20" y="164" class="bold">  Role          Login                  Password</text>
  <text x="20" y="184">  Tenant admin  <tspan class="user">qa@my-app.example</tspan>      <tspan class="dim">(1Password: My-app staging)</tspan></text>
  <text x="20" y="204">  Customer      <tspan class="user">customer@example.com</tspan>   <tspan class="dim">(1Password: My-app staging)</tspan></text>
  <text x="20" y="236" class="head">▸ URLs</text>
  <text x="20" y="262" class="head">▸ Payments</text>
  <text x="20" y="288" class="head">▸ Notes</text>

  <text x="20" y="330" class="dim">Press a section to fold or unfold it. Production and staging</text>
  <text x="20" y="350" class="dim">open their tabs by themselves; a local stack once it runs.</text>
</svg>
