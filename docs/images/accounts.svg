<svg xmlns="http://www.w3.org/2000/svg" width="620" height="430" viewBox="0 0 620 430" role="img" aria-label="session-hub pane, Accounts section: the staging environment unfolded shows its whole test data document with accounts, a test card and a bank account; production and the local stack are folded; below them an account the session gave">
