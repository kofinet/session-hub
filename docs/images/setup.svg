<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-label="Installing for a project with /session-hub:modinstal: Claude reads the repository and the project memory, proposes checks, guards, test data documents and the language, the person confirms, and the settings are saved outside the repository">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #cdd6f4; white-space: pre; }
    .dim { fill: #7f849c; }
    .ok { fill: #a6e3a1; }
    .accent { fill: #fab387; font-weight: 700; }
    .you { fill: #89b4fa; }
    .sel { fill: #1e1e2e; }
    .title { fill: #9399b2; font-size: 12px; }
  </style>
  <rect width="980" height="560" rx="10" fill="#1e1e2e"/>
  <rect width="980" height="30" rx="10" fill="#181825"/>
  <rect y="20" width="980" height="10" fill="#181825"/>
  <circle cx="20" cy="15" r="6" fill="#f38ba8"/><circle cx="40" cy="15" r="6" fill="#f9e2af"/><circle cx="60" cy="15" r="6" fill="#a6e3a1"/>
  <text x="490" y="20" text-anchor="middle" class="title">claude — my-app</text>

  <text x="20" y="60"><tspan class="you">&gt; /session-hub:modinstal</tspan></text>
  <text x="20" y="90" class="dim">● session-hub - project_detect (MCP)</text>
  <text x="20" y="110" class="dim">● Read project memory, CLAUDE.md, .github/workflows/*.yml, compose.dev.yml, scripts/seed.ts</text>

  <text x="20" y="144">● Proposal for <tspan class="accent">my-app</tspan> (match: acme/my-app, branch main):</text>
  <text x="20" y="170" class="dim">  label    type      checks                                        found in</text>
  <text x="20" y="190">  CI       workflow  "CI" on push, also on the session's branch   ci.yml (push + pull_request)</text>
  <text x="20" y="210">  deploy   workflow  "Deploy to production"                       deploy.yml (workflow_run of CI)</text>
  <text x="20" y="230">  smoke    workflow  "Prod smoke"                                 smoke.yml (schedule)</text>
  <text x="20" y="250">  prod     http      https://my-app.example/                      smoke.yml (APEX default)</text>
  <text x="20" y="270">  dev      docker    my-app-dev-*, https://app.localhost/         compose.dev.yml, this session</text>
  <text x="20" y="290">  e2e      busy      my-app-e2e-*                                 scripts/run-e2e.sh</text>
  <text x="20" y="316">  Guards: worktrees, db/migrations · Test data: docs/test_data_prod.md, test_data_local.md · English</text>

  <rect x="14" y="340" width="952" height="150" rx="6" fill="none" stroke="#45475a"/>
  <text x="30" y="368"><tspan class="accent">?</tspan> Apply this for my-app?</text>
  <rect x="28" y="384" width="330" height="24" rx="3" fill="#89b4fa"/>
  <text x="36" y="401" class="sel">❯ 1. Apply all</text>
  <text x="36" y="431">  2. Change something (say what)</text>
  <text x="36" y="461" class="dim">  3. Other</text>

  <text x="20" y="520">● <tspan class="ok">Saved project my-app (6 checks)</tspan> to ~/.claude/session-hub/settings.local.json. Interface language: en.</text>
  <text x="20" y="540" class="dim">  Run /reload-plugins: the band shows the checks within a minute, /hub the test data.</text>
</svg>
